name: CI/CD Pipeline

on:
  push:

jobs:
  project-testing:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # Code Checkout
      # -----------------------------
      - name: Checkout code
        uses: actions/checkout@v4


      # -----------------------------
      # Setup Python
      # -----------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'


      # -----------------------------
      # Setup pip cache
      # -----------------------------
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements_docker.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-


      # -----------------------------
      # Install dependencies
      # -----------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_docker.txt


      # -----------------------------
      # Configure AWS credentials
      # -----------------------------
      # Required for:
      # 1. DVC S3 remote
      # 2. AWS ECR
      # -----------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1


      # -----------------------------
      # Pull data from DVC remote
      # -----------------------------
      - name: Pull data from DVC remote
        run: |
          dvc pull


      # -----------------------------
      # Run DVC pipeline
      # -----------------------------
      - name: Run DVC pipeline
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc repro


      # -----------------------------
      # Test Model Registry
      # -----------------------------
      - name: Test Model Registry
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_USERNAME: iamprashantjain
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          pytest tests/test_model_registry.py


      # -----------------------------
      # Test Model Performance
      # -----------------------------
      - name: Test Model Performance
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_USERNAME: iamprashantjain
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          pytest tests/test_model_perf.py


      # -----------------------------
      # Promote model to Production
      # -----------------------------
      - name: Promote model to Production
        if: success()
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_USERNAME: iamprashantjain
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python src/7_promote_model.py


      # -----------------------------
      # Login to AWS ECR
      # -----------------------------
      - name: Login to AWS ECR
        if: success()
        run: |
          aws ecr get-login-password --region ap-south-1 | \
          docker login \
            --username AWS \
            --password-stdin 739275446561.dkr.ecr.ap-south-1.amazonaws.com


      # -----------------------------
      # Build Docker image
      # -----------------------------
      - name: Build Docker image
        if: success()
        run: |
          docker build \
            -t delivery-time-prediction-api .


      # -----------------------------
      # Run Docker container
      # -----------------------------
      - name: Run Docker container
        if: success()
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          docker run \
            --name delivery-api \
            -p 8000:8000 \
            -e DAGSHUB_TOKEN="$DAGSHUB_TOKEN" \
            -d \
            delivery-time-prediction-api


      # -----------------------------
      # Wait for API
      # -----------------------------
      - name: Wait for API
        if: success()
        run: |
          echo "Waiting for API to start..."

          for i in {1..30}; do

            if curl -s --fail http://localhost:8000/health > /dev/null; then
              echo "API is ready!"
              exit 0
            fi

            echo "Waiting... attempt $i"
            sleep 2

          done

          echo "API failed to start."

          echo "Docker container logs:"
          docker logs delivery-api

          exit 1


      # -----------------------------
      # Test FastAPI prediction endpoint
      # -----------------------------
      - name: Run API tests
        if: success()
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python -m pytest tests/test_api_endpoint.py


      # -----------------------------
      # Health check
      # -----------------------------
      - name: Test API health
        if: success()
        run: |
          curl --fail http://localhost:8000/health


      # -----------------------------
      # Stop Docker container
      # -----------------------------
      - name: Stop Docker container
        if: always()
        run: |
          docker stop delivery-api || true
          docker rm delivery-api || true


      # -----------------------------
      # Tag Docker image
      # -----------------------------
      - name: Tag Docker image
        if: success()
        run: |
          docker tag \
            delivery-time-prediction-api:latest \
            739275446561.dkr.ecr.ap-south-1.amazonaws.com/prashant-ecr:latest


      # -----------------------------
      # Push Docker image to AWS ECR
      # -----------------------------
      - name: Push Docker image to AWS ECR
        if: success()
        run: |
          docker push \
            739275446561.dkr.ecr.ap-south-1.amazonaws.com/prashant-ecr:latest